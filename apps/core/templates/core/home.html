{% extends "base.html" %}

{% block title %}Начало{% endblock %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title text-2xl">Добре дошли, {{ user }}</h1>
    <p>
      Роля: {{ user.get_role_display }}
      {% if user.location %}· Локация: {{ user.location.name }}{% endif %}
    </p>
  </div>
</div>
{% endblock %}
