{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="flex justify-center pt-16">
  <div class="card bg-base-100 w-full max-w-sm shadow-md">
    <form method="post" action="{% url 'login' %}" class="card-body gap-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <h1 class="card-title text-2xl">Вход</h1>

      {% if form.non_field_errors %}
        <div role="alert" class="alert alert-error">
          {% for error in form.non_field_errors %}<span>{{ error }}</span>{% endfor %}
        </div>
      {% endif %}

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="{{ form.username.id_for_label }}">Потребителско име</label>
        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
               value="{{ form.username.value|default:'' }}"
               class="input w-full" autocomplete="username" autofocus required>
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="{{ form.password.id_for_label }}">Парола</label>
        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
               class="input w-full" autocomplete="current-password" required>
      </fieldset>

      <button type="submit" class="btn btn-primary w-full">Влез</button>
    </form>
  </div>
</div>
{% endblock %}
