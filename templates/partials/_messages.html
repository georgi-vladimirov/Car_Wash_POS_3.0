{# Full class names are written out so Tailwind can find them (no "alert-{{ tag }}") #}
<div class="toast toast-top toast-end z-50">
  {% for message in messages %}
    <div class="alert {% if message.level_tag == 'success' %}alert-success{% elif message.level_tag == 'warning' %}alert-warning{% elif message.level_tag == 'error' %}alert-error{% else %}alert-info{% endif %}"
         role="alert"
         x-data="{ show: true }"
         x-show="show"
         x-transition
         x-init="setTimeout(() => show = false, 5000)">
      <span>{{ message }}</span>
      <button type="button" class="btn btn-ghost btn-xs" @click="show = false" aria-label="Затвори">✕</button>
    </div>
  {% endfor %}
</div>
